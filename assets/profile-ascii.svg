<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="100%" stop-color="#0f1724"/>
    </linearGradient>
    <radialGradient id="halo" cx="45%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" x2="1">
      <stop offset="0%" stop-color="#c48a6b"/>
      <stop offset="100%" stop-color="#9b6349"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" x2="1">
      <stop offset="0%" stop-color="#081b2d"/>
      <stop offset="100%" stop-color="#122738"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="screen"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#bg)"/>
  <circle cx="455" cy="340" r="300" fill="url(#halo)"/>

  <!-- face base -->
  <ellipse cx="455" cy="420" rx="210" ry="250" fill="url(#skin)"/>

  <!-- improved curly hair (more volume and curls) -->
  <path d="M260 360 C300 130, 610 120, 650 360 C610 260, 540 200, 455 200 C350 200, 320 300, 260 360 Z" fill="#16110f"/>
  <g fill="#241815" opacity="0.95">
    <path d="M300 320 C330 210, 420 190, 455 200 C390 180, 330 220, 300 320 Z"/>
    <path d="M590 330 C560 210, 500 190, 455 200 C525 180, 560 230, 590 330 Z"/>
  </g>

  <!-- stray curls -->
  <path d="M360 210 C345 190, 335 170, 350 160" stroke="#1d1210" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M490 210 C505 190, 520 170, 510 150" stroke="#1d1210" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- sunglasses: darker, slight tilt to match photo angle -->
  <g transform="rotate(-3 455 430)">
    <rect x="285" y="370" width="155" height="95" rx="20" fill="#0f1720" stroke="#8ea7b8" stroke-width="6"/>
    <rect x="465" y="370" width="155" height="95" rx="20" fill="#0f1720" stroke="#8ea7b8" stroke-width="6"/>
    <rect x="445" y="405" width="22" height="18" fill="#8ea7b8" transform="rotate(7 456 414)"/>
    <path d="M440 403 L520 413" stroke="#aabcc9" stroke-width="3" stroke-linecap="round"/>
    <rect x="332" y="448" width="220" height="18" rx="9" fill="#0b0e11" opacity="0.25"/>
  </g>

  <!-- eyebrows (defined under glasses) -->
  <path d="M330 345 Q385 320 420 345" stroke="#241815" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M485 345 Q540 322 580 350" stroke="#241815" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.95"/>

  <!-- nose subtle shading -->
  <path d="M452 392 Q468 460 455 506" stroke="#8b5a44" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9"/>
  <ellipse cx="445" cy="382" rx="6" ry="9" fill="#e8c9b5" opacity="0.6"/>

  <!-- moustache + facial hair: more granular to reflect beard pattern -->
  <path d="M378 540 Q435 586 455 570 Q475 586 526 540" fill="#201817" opacity="0.95"/>
  <g stroke="#201817" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <path d="M365 565 Q420 610 455 612" fill="none"/>
    <path d="M548 565 Q500 610 455 612" fill="none"/>
  </g>

  <!-- lips -->
  <path d="M400 540 Q455 572 510 540" stroke="#7f404f" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- neck and shirt, tuned colors and collar -->
  <rect x="398" y="620" width="110" height="88" rx="16" fill="#a36d4e"/>
  <path d="M245 700 Q360 625 450 638 Q560 625 655 700 L700 880 L200 880 Z" fill="url(#shirt)"/>
  <path d="M290 700 L350 820 L350 880 L260 880 Z" fill="#071725" opacity="0.8"/>
  <path d="M610 700 L550 820 L550 880 L640 880 Z" fill="#071725" opacity="0.8"/>

  <!-- necklace polished -->
  <g fill="#e0b64a" stroke="#b58f33" stroke-width="1">
    <circle cx="454" cy="692" r="8"/>
    <circle cx="454" cy="712" r="7"/>
    <circle cx="454" cy="732" r="7"/>
    <circle cx="454" cy="752" r="7"/>
    <circle cx="454" cy="772" r="7"/>
  </g>
  <path d="M454 790 L440 815 L468 815 Z" fill="#e0b64a"/>

  <!-- subtle facial highlights -->
  <ellipse cx="365" cy="394" rx="46" ry="26" fill="#f5dac9" opacity="0.18"/>
  <ellipse cx="530" cy="392" rx="36" ry="22" fill="#f5dac9" opacity="0.10"/>

  <!-- shadow under chin -->
  <path d="M320 540 Q455 620 590 540" stroke="#3b2622" stroke-width="18" fill="none" opacity="0.45"/>

  <!-- small reflection on glasses to hint real photo shape -->
  <g transform="rotate(-3 455 430)" opacity="0.45">
    <path d="M345 392 C355 382, 385 376, 420 384" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M510 392 C520 382, 550 376, 575 384" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- finishing soft filter for a cohesive look -->
  <g filter="url(#soft)" opacity="0.9"/>
</svg>
